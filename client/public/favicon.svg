<svg viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="emeraldMain" x1="20" y1="30" x2="160" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#34d399" />
      <stop offset="35%" stopColor="#10b981" />
      <stop offset="85%" stopColor="#059669" />
      <stop offset="100%" stopColor="#047857" />
    </linearGradient>
    <linearGradient id="emeraldBevelTop" x1="40" y1="20" x2="120" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#a7f3d0" stopOpacity="0.9" />
      <stop offset="50%" stopColor="#34d399" stopOpacity="0.5" />
      <stop offset="100%" stopColor="#059669" stopOpacity="0" />
    </linearGradient>
    <linearGradient id="emeraldDepth" x1="30" y1="50" x2="150" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#065f46" />
      <stop offset="100%" stopColor="#022c22" />
    </linearGradient>
    <linearGradient id="indigoMain" x1="180" y1="30" x2="40" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#818cf8" />
      <stop offset="30%" stopColor="#6366f1" />
      <stop offset="75%" stopColor="#4f46e5" />
      <stop offset="100%" stopColor="#3730a3" />
    </linearGradient>
    <linearGradient id="indigoBevelTop" x1="150" y1="30" x2="70" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#c7d2fe" stopOpacity="0.95" />
      <stop offset="45%" stopColor="#818cf8" stopOpacity="0.4" />
      <stop offset="100%" stopColor="#4338ca" stopOpacity="0" />
    </linearGradient>
    <linearGradient id="indigoDepth" x1="160" y1="50" x2="50" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#312e81" />
      <stop offset="100%" stopColor="#1e1b4b" />
    </linearGradient>
    <radialGradient id="sphereLight" cx="38%" cy="35%" r="65%">
      <stop offset="0%" stopColor="#e0e7ff" />
      <stop offset="25%" stopColor="#818cf8" />
      <stop offset="65%" stopColor="#4f46e5" />
      <stop offset="90%" stopColor="#3730a3" />
      <stop offset="100%" stopColor="#1e1b4b" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  {/* Drop shadow */}
  <g transform="translate(4, 7)" opacity="0.6">
    <path d="M 125 152 C 90 185, 38 178, 22 135 C 8 98, 28 48, 68 32 C 92 22, 118 28, 134 44" stroke="#022c22" strokeWidth="24" strokeLinecap="round"/>
    <path d="M 75 48 C 110 15, 162 22, 178 65 C 192 102, 172 152, 132 168 C 108 178, 82 172, 66 156" stroke="#1e1b4b" strokeWidth="24" strokeLinecap="round"/>
  </g>

  {/* Extrusion */}
  <g transform="translate(2, 4)">
    <path d="M 125 152 C 90 185, 38 178, 22 135 C 8 98, 28 48, 68 32 C 92 22, 118 28, 134 44" stroke="url(#emeraldDepth)" strokeWidth="24" strokeLinecap="round"/>
    <path d="M 75 48 C 110 15, 162 22, 178 65 C 192 102, 172 152, 132 168 C 108 178, 82 172, 66 156" stroke="url(#indigoDepth)" strokeWidth="24" strokeLinecap="round"/>
  </g>

  {/* Main 3D Loops */}
  <path d="M 125 152 C 90 185, 38 178, 22 135 C 8 98, 28 48, 68 32 C 92 22, 118 28, 134 44" stroke="url(#emeraldMain)" strokeWidth="24" strokeLinecap="round"/>
  <path d="M 75 48 C 110 15, 162 22, 178 65 C 192 102, 172 152, 132 168 C 108 178, 82 172, 66 156" stroke="url(#indigoMain)" strokeWidth="24" strokeLinecap="round"/>
  <path d="M 60 36 C 75 29, 95 28, 112 34 C 122 38, 130 45, 134 44" stroke="url(#emeraldMain)" strokeWidth="24" strokeLinecap="round"/>

  {/* Top Bevel & Specular Highlight */}
  <path d="M 120 148 C 88 178, 42 172, 28 132 C 16 98, 34 54, 70 38" stroke="url(#emeraldBevelTop)" strokeWidth="7" strokeLinecap="round" transform="translate(-2, -3)"/>
  <path d="M 80 52 C 112 22, 158 28, 172 68 C 184 102, 166 146, 130 162" stroke="url(#indigoBevelTop)" strokeWidth="7" strokeLinecap="round" transform="translate(-2, -3)"/>
  <ellipse cx="48" cy="70" rx="5" ry="18" transform="rotate(-35 48 70)" fill="#ffffff" opacity="0.55"/>
  <ellipse cx="152" cy="130" rx="5" ry="18" transform="rotate(-35 152 130)" fill="#ffffff" opacity="0.45"/>

  {/* Central Sphere */}
  <ellipse cx="103" cy="106" rx="16" ry="12" fill="#0f172a" opacity="0.4" filter="url(#softGlow)"/>
  <circle cx="100" cy="100" r="16" fill="url(#sphereLight)"/>
  <circle cx="95" cy="94" r="5" fill="#ffffff" opacity="0.85"/>
  <circle cx="94" cy="93" r="2" fill="#ffffff" opacity="0.95"/>
</svg>