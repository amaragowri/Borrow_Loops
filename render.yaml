services:
  # -------------------------------------------------------------
  # BorrowLoop Backend Web Service (Node.js / Express)
  # -------------------------------------------------------------
  - type: web
    name: borrowloop-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard or Environment settings
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: PAYMENT_PROVIDER_KEY
        value: mock_pk_test_borrowloop
      - key: PAYMENT_SECRET
        value: mock_sk_test_borrowloop

  # -------------------------------------------------------------
  # BorrowLoop Frontend Static Site (Vite / React)
  # -------------------------------------------------------------
  - type: web
    name: borrowloop-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
